services:
  netghost:
    build: .
    network_mode: "host"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - LANG=${LANG:-en_US.UTF-8}
      - INTERFACE=${INTERFACE:-}
      - TERM=${TERM:-xterm-256color}
      - NETGHOST_DEV=${NETGHOST_DEV:-0}
    stdin_open: true
    tty: true
    working_dir: /app
    entrypoint: ["python", "-O", "-m", "netghost"]
